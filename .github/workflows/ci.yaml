name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install

      - run: |
          npm run lint
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and push all images to ECR
        run: |
          IMAGES=(
            "api api/Dockerfile"
            "client client/Dockerfile"
          )

          for image in "${IMAGES[@]}"; do
            NAME=$(echo $image | cut -d' ' -f1)
            DOCKERFILE=$(echo $image | cut -d' ' -f2)

            {
              docker build \
                --tag 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/$NAME:latest \
                -f $DOCKERFILE \
                . && docker push 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/$NAME:latest
            } &
          done

          wait

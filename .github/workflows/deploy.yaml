name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    env:
      AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all images to ECR
        run: |
          IMAGES=(
            "api api/Dockerfile"
            "client client/Dockerfile"
            "nginx nginx/Dockerfile"
          )

          for image in "${IMAGES[@]}"; do
            NAME=$(echo $image | cut -d' ' -f1)
            DOCKERFILE=$(echo $image | cut -d' ' -f2)

            {
              docker build \
                --tag ${{ secrets.AWS_ECR_REGISTRY }}/carental/$NAME:latest \
                -f $DOCKERFILE \
                . && docker push ${{ secrets.AWS_ECR_REGISTRY }}/carental/$NAME:latest
            } &
          done

          wait

      - name: Copy docker-compose and db files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: |
            docker-compose.yaml
            db/
          target: ~/carental
          debug: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          debug: true
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose
            cd ~/carental
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ECR_REGISTRY }}
            sudo docker-compose pull
            sudo docker-compose up -d --remove-orphans
            sudo docker system prune -f

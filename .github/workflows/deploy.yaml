name: Build and Deploy to EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and push all images to ECR
        run: |
          IMAGES=(
            "api api/Dockerfile"
            "client client/Dockerfile"
            "nginx nginx/Dockerfile"
          )

          for image in "${IMAGES[@]}"; do
            NAME=$(echo $image | cut -d' ' -f1)
            DOCKERFILE=$(echo $image | cut -d' ' -f2)

            {
              docker build \
                --tag 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/$NAME:latest \
                -f $DOCKERFILE \
                . && docker push 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/$NAME:latest
            } &
          done

          wait

  deploy-to-ec2:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    environment:
      name: "EC2"
      url: ${{ steps.deploy.outputs.vm_url }}
    steps:
      - id: deploy
        name: Deploy
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1.0.2
        with:
          checkout: true
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_default_region: ap-southeast-1

          env_aws_secret: prod/Carental/Secret,prod/Carental/PostgresQL

services:
  postgres:
    image: postgres
    networks:
      - carental-network
    hostname: postgres
    ports:
      - 5432:5432
    env_file:
      - ./db/.env
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: carental # Set your own password here
      POSTGRES_DB: carental
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready', '-d', 'db_prod']
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  nginx:
    restart: always
    image: ${AWS_ECR_REGISTRY}/carental/nginx:latest
    networks:
      - carental-network
    hostname: nginx
    ports:
      - 8080:80
    depends_on:
      - api
      - client
  api:
    image: ${AWS_ECR_REGISTRY}/carental/api:latest
    networks:
      - carental-network
    hostname: api
    entrypoint: ["npm", "run", "start:seed:prod"]
    volumes:
      - ./api:/usr/src/app:delegated
      - api_node_modules:/usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:carental@postgres:5432/carental
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
  client:
    image: ${AWS_ECR_REGISTRY}/carental/client:latest
    networks:
      - carental-network
    hostname: client
    entrypoint: ["npm", "run", "start"]
    volumes:
      - ./client:/app:delegated
      - client_node_modules:/usr/src/app/node_modules
      - client_assets:/usr/src/app/public
    env_file:
      - .env
    environment:
      - WDS_SOCKET_PORT=0
      - API_BASE_URL=http://nginx/api
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - NEXT_PUBLIC_BASE_URL=http://nginx
      - PORT=3000

volumes:
  db_pgdata:
  api_node_modules:
  client_node_modules:
  client_assets:

networks:
  carental-network:

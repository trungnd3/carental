global:
  imagePullPolicy: Always

postgresql:
  namespaceOverride: postgresql
  auth:
    username: postgres
    password: postgres
  primary:
    initdb:
      scripts:
        create-dbs.sql: |
          CREATE DATABASE carental;

api:
  enabled: true
  replicas: 1
  image: 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/api:latest
  port: 3001
  jwt:
    secret: 
    expiration: 3600

client:
  enabled: true
  replicas: 1
  image: 391898470917.dkr.ecr.ap-southeast-1.amazonaws.com/carental/client:latest
  port: 3000
